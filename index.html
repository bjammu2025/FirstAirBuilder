<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta

<title>First Air Builder</title>

  

<style>

/* =========================================================
   GENERAL
   ========================================================= */

html,
body {

  margin: 0;
  padding: 0;

  background: #121212;
  color: white;

  font-family: Arial, sans-serif;

  width: 100%;
  min-height: 100%;

  overflow-x: hidden;
}


body {

  display: flex;
  justify-content: center;
  align-items: flex-start;

}


.container {

  width: 100%;
  min-height: 100vh;

  padding: 12px;

  box-sizing: border-box;

  text-align: center;

  display: flex;
  flex-direction: column;
  align-items: center;

}


/* =========================================================
   SCREENS
   ========================================================= */

.screen {

  display: none;

  width: 100%;

}


.screen.visible {

  display: block;

}


/* =========================================================
   HEADINGS
   ========================================================= */

h2 {

  margin: 15px 0 5px;

  font-size: 3rem;

}


h3 {

  margin: 12px 0;

  font-size: 2rem;

}


/* =========================================================
   VERSION
   ========================================================= */

.version {

  font-size: 0.75rem;

  color: #777;

  margin-bottom: 12px;

}


/* =========================================================
   INPUTS / BUTTONS
   ========================================================= */

input,
button {

  font-size: 1.7rem;

  padding: 1rem;

  margin: 0.6rem 0;

  width: 95%;

  max-width: 900px;

  border: none;

  border-radius: 14px;

  box-sizing: border-box;

}


input {

  background: white;

  color: black;

}


button {

  background: #1e88e5;

  color: white;

  cursor: pointer;

}


button:hover {

  background: #1565c0;

}


.cameraButton {

  background: #00897b;

}


.readButton {

  background: #43a047;

}


.stopButton {

  background: #d32f2f;

}


.backButton {

  background: #555;

}


.verifyButton {

  background: #43a047;

}


.cancelButton {

  background: #d32f2f;

}


/* =========================================================
   POSITION / USER INFORMATION
   ========================================================= */

.infoBox {

  background: #1e1e1e;

  border: 1px solid #444;

  border-radius: 12px;

  padding: 8px;

  margin-bottom: 8px;

  font-size: 1.15rem;

}


.infoBox span {

  color: #00e676;

  font-weight: bold;

}


/* =========================================================
   CAMERA AREA
   ========================================================= */

/*
   IMPORTANT:

   The real video element is hidden.

   We display only a canvas containing the section
   that corresponds to the green scanning area.
*/

.cameraContainer {

  display: none;

  width: 100%;

  max-width: 700px;

  margin: 8px auto;

  position: relative;

  background: black;

  border-radius: 14px;

  overflow: hidden;

}


.cameraContainer.active {

  display: block;

}


/*
   Hidden real camera.
*/

.realCamera {

  position: absolute;

  width: 1px;

  height: 1px;

  opacity: 0;

  pointer-events: none;

}


/*
   This is the visible camera image.

   It contains ONLY the green scanning area.
*/

#allocatePreview,
#offloadPreview {

  width: 100%;

  display: block;

  background: black;

}


/*
   Green box.

   Since the displayed image IS the cropped box,
   this border surrounds the entire visible image.
*/

.scanBox {

  position: absolute;

  inset: 4px;

  border: 4px solid #00ff00;

  border-radius: 10px;

  pointer-events: none;

  box-sizing: border-box;

}


/* =========================================================
   CAMERA STATUS
   ========================================================= */

.cameraStatus {

  font-size: 1.2rem;

  margin: 6px 0;

  min-height: 2rem;

}


.success {

  color: #00e676;

}


.error {

  color: #ff5252;

}


.scanning {

  color: #ffeb3b;

}


/* =========================================================
   VERIFICATION BOX
   ========================================================= */

.verificationOverlay {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.82);

  z-index: 9999;

  align-items: center;

  justify-content: center;

  padding: 20px;

  box-sizing: border-box;

}


.verificationOverlay.active {

  display: flex;

}


.verificationBox {

  width: 95%;

  max-width: 650px;

  background: #222;

  border: 4px solid #00e676;

  border-radius: 20px;

  padding: 25px 15px;

  box-sizing: border-box;

}


.verificationTitle {

  font-size: 2rem;

  color: #00e676;

  margin-bottom: 15px;

}


.verificationLabel {

  font-size: 1.2rem;

  color: #aaa;

}


.verificationAWB {

  font-size: 3rem;

  font-weight: bold;

  margin: 15px 0 25px;

  word-break: break-all;

}


.verificationButtons {

  display: flex;

  flex-direction: column;

  align-items: center;

}


/* =========================================================
   TABLES
   ========================================================= */

.tableContainer {

  width: 100%;

  overflow-x: auto;

}


table {

  width: 100%;

  margin-top: 10px;

  border-collapse: collapse;

  font-size: 1rem;

}


th,
td {

  border: 1px solid #777;

  padding: 8px;

  text-align: center;

}


th {

  background: #252525;

}


tr:nth-child(even) {

/* =========================================================
   LIVE VIEW POSITION TABLE
   ========================================================= */

.livePositionSection {

  margin: 12px 0 25px;

}


.livePositionTitle {

}


/* =========================================================
   HIDDEN
   ========================================================= */

.hidden {

  display: none !important;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  h2 {

    font-size: 2.3rem;

  }


  table {

    font-size: 0.85rem;

  }


  th,
  td {

    padding: 6px;

  }

}

</style>

</head>

<!-- ======================================================

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script type="module">


/* =========================================================
   FIREBASE
   ========================================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {

  getFirestore,

  collection,

  addDoc,

  onSnapshot,

  doc,

  updateDoc,

  serverTimestamp,

  query,

  where,

  getDocs,

  deleteDoc

} from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyB3s2DD2auW9bppmAe2ReqZxiz-jCYvd7U",

  authDomain:
    "firstairbuilder.firebaseapp.com",

  projectId:
    "firstairbuilder",

  storageBucket:
    "firstairbuilder.appspot.com",

  messagingSenderId:
    "879078166665",

  appId:
    "1:879078166665:web:40f63a1b2fdfb7833d3658"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let positionId = "";

let currentUser = "";

let liveUnsubscribe = null;

let cameraStream = null;

let currentCameraMode = null;

let ocrWorker = null;

let ocrBusy = false;

let scanningActive = false;

let scanTimer = null;

let detectedAWB = null;

let cameraAnimationFrame = null;

let lastPreviewTime = 0;


/*
   IMPORTANT PERFORMANCE SETTINGS

   OCR is expensive.

   We wait at least 1.5 seconds between OCR scans.

   This prevents multiple OCR jobs from stacking up.
*/

const OCR_INTERVAL = 1500;


/*
   Prevent same AWB from being detected repeatedly
   immediately after a successful scan.
*/

let lastDetectedCode = "";

let lastDetectedTime = 0;


/* =========================================================
   SCREEN CONTROL
   ========================================================= */

function switchScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(el => {

      el.classList.remove("visible");

    });


  document
    .getElementById(id)
    .classList.add("visible");

}


/* =========================================================
   HOME
   ========================================================= */

window.goHome = async () => {

  await closeCamera();


  switchScreen("home");

  document

  document
    .getElementById("offloadTable")

  positionId = "";

  currentUser = "";

  currentCameraMode = null;

};


/* =========================================================
   ALLOCATE
   ========================================================= */

window.goToAllocate = () => {

window.startAllocate = async () => {

/* =========================================================
   OFFLOAD
   ========================================================= */

window.goToOffload = () => {

  currentUser =
    document
      .getElementById("userName")
      .value
      .trim();


  if (!currentUser) {

    alert("Please enter user name");

  }


  switchScreen("offloadStart");

};


window.startOffload = async () => {

  positionId =
    document
      .getElementById("offloadPositionId")
      .value
      .trim();


  if (!positionId) {

    alert("Enter Position ID");

    return;

  }


  document
    .getElementById("offloadPosition")
    .innerText =
    positionId;


  document
    .getElementById("offloadUser")
    .innerText =
    currentUser;


  switchScreen("offloadScan");


  await loadOffloadAWBs(positionId);

};


/* =========================================================
   EXTRACT AWB
   ========================================================= */

function extract518Number(rawText) {

  if (!rawText) {

    return null;

  }


  let text =
    String(rawText)
      .toUpperCase();


  text =
    text
      .replace(/\r/g, " ")
      .replace(/\n/g, " ")
      .replace(/\s+/g, " ")
      .trim();


  /*
     Normal format
     518-YWG-13634095
  */

  let match =
    text.match(
      /\b518-[A-Z]{3}-\d{8}\b/
    );


  if (match) {

    return match[0];

  }


  /*
     OCR may remove spaces/hyphens
  */

  match =
    text.match(
      /518\s*[-]?\s*[A-Z]{3}\s*[-]?\s*[0-9A-Z]{8}/
    );


  if (match) {

    let result =
      match[0]
        .replace(/\s+/g, "-")
        .replace(/--+/g, "-");


    result =
      result
        .replace(/O/g, "0")
        .replace(/I/g, "1")
        .replace(/L/g, "1");


    if (
      /^518-[A-Z]{3}-\d{8}$/
        .test(result)
    ) {

      return result;

    }

  }


  return null;

}


/* =========================================================
   GET ONLY NUMBER AFTER 518-YWG-
   ========================================================= */

function getAWBNumber(code) {

  if (!code) {

    return "";

  }


  const match =
    String(code)
      .toUpperCase()
      .match(
        /^518-YWG-(\d{8})$/
      );


  if (match) {

    return match[1];

  }


  return code;

}


/* =========================================================
   OCR INITIALIZATION
   ========================================================= */

async function initializeOCR() {

  if (ocrWorker) {

    return true;

  }


  setStatus(
    "Loading OCR engine...",
    "scanning"
  );


  try {

    ocrWorker =
      await Tesseract.createWorker(
        "eng",
        1,
        {

          logger(info) {

            console.log(
              "OCR:",
              info.status,
              info.progress
            );

          }

        }
      );


    await ocrWorker.setParameters({

      tessedit_char_whitelist:
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- ",

      preserve_interword_spaces:
        "1"

    });


    return true;


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Could not load OCR.",
      "error"
    );


    return false;

  }

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "") {

  if (
    currentCameraMode ===
    "allocate"
  ) {

    const el =
      document.getElementById(
        "allocateCameraStatus"
      );


    el.innerText =
      message;


    el.className =
      "cameraStatus " + type;

  }


  if (
    currentCameraMode ===
    "offload"
  ) {

    const el =
      document.getElementById(
        "offloadCameraStatus"
      );


    el.innerText =
      message;


    el.className =
      "cameraStatus " + type;

  }

}


/* =========================================================
   CAMERA PREVIEW
   ========================================================= */

/*
   We crop the real camera.

   The original camera resolution may be 1280x720.

   We take the CENTER 84% width and CENTER 40% height.

   That is the area that used to be inside the green box.

   Only that crop gets displayed.
*/

function updatePreview() {

  if (!cameraStream ||
      !currentCameraMode) {

    return;

  }


  const video =
    currentCameraMode === "allocate"

      ? document.getElementById(
          "allocateVideo"
        )

      : document.getElementById(
          "offloadVideo"
        );


  const canvas =
    currentCameraMode === "allocate"

      ? document.getElementById(
          "allocatePreview"
        )

      : document.getElementById(
          "offloadPreview"
        );


  if (
    !video ||
    video.readyState <
      HTMLMediaElement.HAVE_CURRENT_DATA
  ) {

    cameraAnimationFrame =
      requestAnimationFrame(
        updatePreview
      );

    return;

  }


  /*
     Only update preview about 15 FPS.

     We don't need 30/60 FPS for OCR.
     This saves CPU on the Zebra.
  */

  const now =
    performance.now();


  if (
    now - lastPreviewTime <
    66
  ) {

    cameraAnimationFrame =
      requestAnimationFrame(
        updatePreview
      );

    return;

  }


  lastPreviewTime =
    now;


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (!width || !height) {

    cameraAnimationFrame =
      requestAnimationFrame(
        updatePreview
      );

    return;

  }


  /*
     SAME CROP AS OCR
  */

  const cropWidth =
    Math.floor(width * 0.84);


  const cropHeight =
    Math.floor(height * 0.40);


  const cropX =
    Math.floor(
      (width - cropWidth) / 2
    );


  const cropY =
    Math.floor(
      (height - cropHeight) / 2
    );


  /*
     Keep the preview at a manageable resolution.

     This greatly reduces memory/CPU use.
  */

  const outputWidth =
    Math.min(
      cropWidth,
      900
    );


  const outputHeight =
    Math.floor(
      outputWidth *
      cropHeight /
      cropWidth
    );


  if (
    canvas.width !== outputWidth ||
    canvas.height !== outputHeight
  ) {

    canvas.width =
      outputWidth;

    canvas.height =
      outputHeight;

  }


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha: false
      }
    );


  ctx.drawImage(

    video,

    cropX,
    cropY,
    cropWidth,
    cropHeight,

    0,
    0,
    outputWidth,
    outputHeight

  );


  cameraAnimationFrame =
    requestAnimationFrame(
      updatePreview
    );

}


/* =========================================================
   CAPTURE OCR FRAME
   ========================================================= */

function captureFrame() {

  const video =
    currentCameraMode === "allocate"

      ? document.getElementById(
          "allocateVideo"
        )

      : document.getElementById(
          "offloadVideo"
        );


  if (
    !video ||
    video.readyState <
      HTMLMediaElement.HAVE_CURRENT_DATA
  ) {

    return null;

  }


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (!width || !height) {

    return null;

  }


  /*
     Same exact area as the visible green box.
  */

  const cropWidth =
    Math.floor(width * 0.84);


  const cropHeight =
    Math.floor(height * 0.40);


  const cropX =
    Math.floor(
      (width - cropWidth) / 2
    );


  const cropY =
    Math.floor(
      (height - cropHeight) / 2
    );


  /*
     Don't give Tesseract a giant image.
  */

  const maxWidth = 900;


  const outputWidth =
    Math.min(
      cropWidth,
      maxWidth
    );


  const outputHeight =
    Math.floor(
      outputWidth *
      cropHeight /
      cropWidth
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    outputWidth;


  canvas.height =
    outputHeight;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  /*
     Moderate contrast.

     Do NOT use aggressive filters because
     they can actually make OCR worse.
  */

  ctx.filter =
    "contrast(1.15)";


  ctx.drawImage(

    video,

    cropX,
    cropY,
    cropWidth,
    cropHeight,

    0,
    0,
    outputWidth,
    outputHeight

  );


  ctx.filter =
    "none";


  return canvas;

}


/* =========================================================
   START CONTINUOUS SCANNING
   ========================================================= */

async function startContinuousScanning() {

  if (scanningActive) {

    return;

  }


  scanningActive =
    true;


  setStatus(
    "🔍 Scanning automatically...",
    "scanning"
  );


  /*
     Don't start another loop if one already exists.
  */

  if (scanTimer) {

    clearTimeout(scanTimer);

    scanTimer =
      null;

  }


  continuousScanLoop();

}


/* =========================================================
   CONTINUOUS SCAN LOOP
   ========================================================= */

async function continuousScanLoop() {

  if (!scanningActive ||
      !cameraStream ||
      !currentCameraMode) {

    return;

  }


  /*
     If OCR is busy, DON'T start another OCR operation.

     This is one of the most important fixes for
     the camera hanging.
  */

  if (!ocrBusy) {

    await performOCRScan();

  }


  /*
     Wait before the next scan.

     setTimeout prevents OCR operations from stacking.
  */

  if (scanningActive) {

    scanTimer =
      setTimeout(

        continuousScanLoop,

        OCR_INTERVAL

      );

  }

}


/* =========================================================
   OCR SCAN
   ========================================================= */

async function performOCRScan() {

  if (
    ocrBusy ||
    !scanningActive ||
    !cameraStream
  ) {

    return;

  }


  if (!ocrWorker) {

    const loaded =
      await initializeOCR();


    if (!loaded) {

      return;

    }

  }


  ocrBusy =
    true;


  try {

    const canvas =
      captureFrame();


    if (!canvas) {

      return;

    }


    const result =
      await ocrWorker.recognize(
        canvas
      );


    /*
       Explicitly release our reference.

       Browser garbage collection will clean
       the temporary canvas.
    */

    const rawText =
      result.data.text;


    console.log(
      "OCR:",
      rawText
    );


    const awb =
      extract518Number(
        rawText
      );


    if (!awb) {

      return;

    }


    /*
       Don't repeatedly show the same AWB
       every 1.5 seconds.
    */

    const now =
      Date.now();


    if (
      awb === lastDetectedCode &&
      now - lastDetectedTime <
        5000
    ) {

      return;

    }


    lastDetectedCode =
      awb;


    lastDetectedTime =
      now;


    /*
       STOP scanning while user verifies.
    */

    scanningActive =
      false;


    if (scanTimer) {

      clearTimeout(
        scanTimer
      );

      scanTimer =
        null;

    }


    detectedAWB =
      awb;


    showVerification(
      awb
    );


    vibrate();

  } catch (error) {

    console.error(
      "OCR error:",
      error
    );

  } finally {

    ocrBusy =
      false;

  }

}


/* =========================================================
   VERIFICATION
   ========================================================= */

function showVerification(code) {

  const overlay =
    document.getElementById(
      "verificationOverlay"
    );


  const awbElement =
    document.getElementById(
      "verificationAWB"
    );


  awbElement.innerText =
    getAWBNumber(code);


  overlay.classList.add(
    "active"
  );

}


window.verifyDetectedAWB =
  async () => {

    if (!detectedAWB) {

      return;

    }


    const code =
      detectedAWB;


    /*
       Hide verification first.
    */

    document
      .getElementById(
        "verificationOverlay"
      )
      .classList.remove(
        "active"
      );


    detectedAWB =
      null;


    /*
       Save depending on mode.
    */

    if (
      currentCameraMode ===
      "allocate"
    ) {

      await handleScan(
        code
      );

    }


    if (
      currentCameraMode ===
      "offload"
    ) {

      await handleOffload(
        code
      );

    }


    /*
       Resume automatic scanning.
    */

    if (
      cameraStream &&
      currentCameraMode
    ) {

      scanningActive =
        true;


      setStatus(
        "🔍 Scanning automatically...",
        "scanning"
      );


      continuousScanLoop();

    }

  };


window.cancelDetectedAWB =
  () => {

    detectedAWB =
      null;


    document
      .getElementById(
        "verificationOverlay"
      )
      .classList.remove(
        "active"
      );


    /*
       Reset duplicate protection so the
       camera can detect the same label again.
    */

    lastDetectedCode =
      "";


    lastDetectedTime =
      0;


    /*
       Resume scanning.
    */

    if (
      cameraStream &&
      currentCameraMode
    ) {

      scanningActive =
        true;


      setStatus(
        "🔍 Scanning automatically...",
        "scanning"
      );


      continuousScanLoop();

    }

  };


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera(mode) {

  await closeCamera();


  currentCameraMode =
    mode;


  const video =
    mode === "allocate"

      ? document.getElementById(
          "allocateVideo"
        )

      : document.getElementById(
          "offloadVideo"
        );


  const container =
    mode === "allocate"

      ? document.getElementById(
          "allocateCameraContainer"
        )

      : document.getElementById(
          "offloadCameraContainer"
        );


  const openButton =
    mode === "allocate"

      ? document.getElementById(
          "openAllocateCameraButton"
        )

      : document.getElementById(
          "openOffloadCameraButton"
        );


  const closeButton =
    mode === "allocate"

      ? document.getElementById(
          "closeAllocateButton"
        )

      : document.getElementById(
          "closeOffloadButton"
        );


  try {

    setStatus(
      "📷 Starting camera...",
      "scanning"
    );


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            },

            frameRate: {
              ideal: 15,
              max: 24
            }

          },

          audio: false

        });


    video.srcObject =
      cameraStream;


    await video.play();


    container.classList.add(
      "active"
    );


    openButton.classList.add(
      "hidden"
    );


    closeButton.classList.remove(
      "hidden"
    );


    /*
       Start visible cropped preview.
    */

    lastPreviewTime =
      0;


    updatePreview();


    /*
       Load OCR.

       Only after OCR is ready do we start scanning.
    */

    const loaded =
      await initializeOCR();


    if (!loaded) {

      return;

    }


    startContinuousScanning();


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    setStatus(
      "❌ Camera error: " +
      error.message,
      "error"
    );


    alert(
      "Camera could not be opened.\n\n" +
      "Make sure Chrome has permission to use the camera."
    );

  }

}


/* =========================================================
   OPEN ALLOCATE CAMERA
   ========================================================= */

window.openAllocateCamera =
  async () => {

    await startCamera(
      "allocate"
    );

  };


/* =========================================================
   OPEN OFFLOAD CAMERA
   ========================================================= */

window.openOffloadCamera =
  async () => {

    await startCamera(
      "offload"
    );

  };


/* =========================================================
   CLOSE CAMERA
   ========================================================= */

window.closeCamera =
  async () => {

    /*
       Stop scanning immediately.
    */

    scanningActive =
      false;


    if (scanTimer) {

      clearTimeout(
        scanTimer
      );

      scanTimer =
        null;

    }


    if (cameraAnimationFrame) {

      cancelAnimationFrame(
        cameraAnimationFrame
      );

      cameraAnimationFrame =
        null;

    }


    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      cameraStream =
        null;

    }


    const allocateVideo =
      document.getElementById(
        "allocateVideo"
      );


    const offloadVideo =
      document.getElementById(
        "offloadVideo"
      );


    allocateVideo.srcObject =
      null;


    offloadVideo.srcObject =
      null;


    document
      .getElementById(
        "allocateCameraContainer"
      )
      .classList.remove(
        "active"
      );


    document
      .getElementById(
        "offloadCameraContainer"
      )
      .classList.remove(
        "active"
      );


    document
      .getElementById(
        "openAllocateCameraButton"
      )
      .classList.remove(
        "hidden"
      );


    document
      .getElementById(
        "openOffloadCameraButton"
      )
      .classList.remove(
        "hidden"
      );


    document
      .getElementById(
        "closeAllocateButton"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "closeOffloadButton"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "verificationOverlay"
      )
      .classList.remove(
        "active"
      );


    detectedAWB =
      null;


    currentCameraMode =
      null;

  };


/* =========================================================
   LOAD ALLOCATE AWBs
   ========================================================= */

async function loadAllocateAWBs(posId) {

  const table =
    document.getElementById(
      "scanTable"
    );


  table.innerHTML =
    "<tr><td colspan='4'>Loading...</td></tr>";


  const q =
    query(

      collection(
        db,
        "scans"
      ),

      where(
        "positionId",
        "==",
        posId
      )

    );


  const snapshot =
    await getDocs(q);


  if (
    snapshot.empty
  ) {

    table.innerHTML =
      `<tr>
        <td colspan="4">
          No AWBs allocated
        </td>
      </tr>`;

    return;

  }


  let html = "";

  let idx = 1;


  snapshot.forEach(
    docSnap => {

      const d =
        docSnap.data();


      const scannedAt =
        d.scannedAt

          ? new Date(
              d.scannedAt.seconds *
              1000
            ).toLocaleString()

          : "N/A";


      html +=
        `<tr>

          <td>${idx++}</td>

          <td>
            ${getAWBNumber(d.code)}
          </td>

          <td>
            ${scannedAt}
          </td>

          <td>
            ${d.scannedBy || ""}
          </td>

        </tr>`;

    }
  );


  table.innerHTML =
    html;

}


/* =========================================================
   HANDLE ALLOCATE
   ========================================================= */

async function handleScan(code) {

  if (!code) {

    return;

  }


  const q =
    query(

      collection(
        db,
        "scans"
      ),

      where(
        "code",
        "==",
        code
      )

    );


  const snapshot =
    await getDocs(q);


  if (
    !snapshot.empty
  ) {

    let duplicate =
      null;


    snapshot.forEach(
      docSnap => {

        const d =
          docSnap.data();


        if (
          d.positionId !==
          "[REMOVED]"
        ) {

          duplicate =
            d;

        }

      }
    );


    if (duplicate) {

      setStatus(

        "❌ Duplicate AWB! Already allocated to Position ID: " +
        duplicate.positionId,

        "error"

      );


      vibrate();


      return;

    }

  }


  try {

    await addDoc(

      collection(
        db,
        "scans"
      ),

      {

        code:
          code,

        positionId:
          positionId,

        scannedAt:
          serverTimestamp(),

        scannedBy:
          currentUser

      }

    );


    await loadAllocateAWBs(
      positionId
    );


    setStatus(
      "✅ AWB saved. Scanning...",
      "success"
    );


    vibrate();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Failed to save AWB.",
      "error"
    );

  }

}


/* =========================================================
   LOAD OFFLOAD AWBs
   ========================================================= */

async function loadOffloadAWBs(posId) {

  const table =
    document.getElementById(
      "offloadTable"
    );


  table.innerHTML =
    "<tr><td colspan='4'>Loading...</td></tr>";


  const q =
    query(

      collection(
        db,
        "scans"
      ),

      where(
        "positionId",
        "==",
        posId
      )

    );


  const snapshot =
    await getDocs(q);


  if (
    snapshot.empty
  ) {

    table.innerHTML =
      `<tr>
        <td colspan="4">
          No AWBs found
        </td>
      </tr>`;

    return;

  }


  let html = "";

  let idx = 1;


  snapshot.forEach(
    docSnap => {

      const d =
        docSnap.data();


      const scannedAt =
        d.scannedAt

          ? new Date(
              d.scannedAt.seconds *
              1000
            ).toLocaleString()

          : "N/A";


      html +=
        `<tr>

          <td>${idx++}</td>

          <td>
            ${getAWBNumber(d.code)}
          </td>

          <td>
            ${scannedAt}
          </td>

          <td>
            ${d.scannedBy || ""}
          </td>

        </tr>`;

    }
  );


  table.innerHTML =
    html;

}


/* =========================================================
   HANDLE OFFLOAD
   ========================================================= */

async function handleOffload(code) {

  if (!code) {

    return;

  }


  const q =
    query(

      collection(
        db,
        "scans"
      ),

      where(
        "code",
        "==",
        code
      )

    );


  const snapshot =
    await getDocs(q);


  if (
    snapshot.empty
  ) {

    setStatus(
      "❌ AWB not found.",
      "error"
    );

    return;

  }


  let found =
    false;


  for (
    const docSnap
    of snapshot.docs
  ) {

    const d =
      docSnap.data();


    if (
      d.positionId ===
      positionId
    ) {

      await updateDoc(

        doc(
          db,
          "scans",
          docSnap.id
        ),

        {

          positionId:
            "[REMOVED]"

        }

      );


      setStatus(
        "✅ Removed: " +
        getAWBNumber(code),

        "success"
      );


      found =
        true;


      vibrate();


      break;

    }

  }


  if (!found) {

    setStatus(

      "❌ AWB is not allocated to Position ID: " +
      positionId,

      "error"

    );

  }


  await loadOffloadAWBs(
    positionId
  );

}


/* =========================================================
   LIVE VIEW
   ========================================================= */

window.goToLiveView =
  () => {

    switchScreen(
      "liveView"
    );


    const container =
      document.getElementById(
        "liveTables"
      );


    container.innerHTML =
      "<div>Loading...</div>";


    if (
      typeof liveUnsubscribe ===
      "function"
    ) {

      liveUnsubscribe();

    }


    liveUnsubscribe =
      onSnapshot(

        collection(
          db,
          "scans"
        ),

        snapshot => {

          const groups =
            {};


          snapshot.forEach(
            docSnap => {

              const data =
                docSnap.data();


              if (

                data.positionId ===
                "[REMOVED]"

              ) {

                return;

              }


              if (
                !data.positionId
              ) {

                return;

              }


              if (
                !data.scannedAt
              ) {

                return;

              }


              if (
                !groups[
                  data.positionId
                ]
              ) {

                groups[
                  data.positionId
                ] = [];

              }


              groups[
                data.positionId
              ].push({

                ...data,

                scannedDate:
                  new Date(
                    data.scannedAt.seconds *
                    1000
                  )

              });

            }

          );


          const positions =
            Object.keys(groups)
              .sort();


          if (
            positions.length === 0
          ) {

            container.innerHTML =
              "<div>No active AWBs.</div>";

            return;

          }


          let html = "";


          positions.forEach(
            pos => {

              const rows =
                groups[pos];


              rows.sort(
                (a, b) =>
                  b.scannedDate -
                  a.scannedDate
              );


              html +=

                `<div class="livePositionSection">

                  <div class="livePositionTitle">

                    Position ID:
                    ${pos}

                  </div>


                  <div class="tableContainer">

                    <table>

                      <thead>

                        <tr>

                          <th>#</th>

                          <th>AWB</th>

                          <th>Scanned At</th>

                          <th>Scanned By</th>

                        </tr>

                      </thead>


                      <tbody>

                        ${
                          rows.map(
                            (entry, idx) =>

                              `<tr>

                                <td>
                                  ${idx + 1}
                                </td>

                                <td>
                                  ${getAWBNumber(
                                    entry.code
                                  )}
                                </td>

                                <td>
                                  ${entry.scannedDate
                                    .toLocaleString()}
                                </td>

                                <td>
                                  ${entry.scannedBy || ""}
                                </td>

                              </tr>`

                          ).join("")
                        }

                      </tbody>

                    </table>

                  </div>

                </div>`;

            }

          );


          container.innerHTML =
            html;

        }

      );

  };


/* =========================================================
   EXPORT
   ========================================================= */

/*
   IMPORTANT:

   This version performs ONE getDocs().

   It creates ONE CSV string.

   It creates ONE download link.

   It then deletes the exported records.

   There is NO onSnapshot() here.

   Therefore clicking EXPORT creates ONE file only.
*/

window.exportToCSV =
  async () => {

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "scans"
          )
        );


      let csv =
        "\uFEFF" +
        "Airway Bill,Position ID,Scanned At,Scanned By\n";


      const recordsToDelete =
        [];


      let count =
        0;


      snapshot.forEach(
        docSnap => {

          const d =
            docSnap.data();


          /*
             Don't export removed AWBs.
          */

          if (
            d.positionId ===
            "[REMOVED]"
          ) {

            return;

          }


          if (
            !d.scannedAt
          ) {

            return;

          }


          const awb =
            getAWBNumber(
              d.code
            );


          const scannedAt =
            new Date(
              d.scannedAt.seconds *
              1000
            ).toLocaleString();


          /*
             Escape CSV values.
          */

          const safeAWB =
            String(awb)
              .replace(/"/g, '""');


          const safePosition =
            String(
              d.positionId || ""
            )
              .replace(/"/g, '""');


          const safeDate =
            String(scannedAt)
              .replace(/"/g, '""');


          const safeUser =
            String(
              d.scannedBy || ""
            )
              .replace(/"/g, '""');


          csv +=
            `"${safeAWB}",` +
            `"${safePosition}",` +
            `"${safeDate}",` +
            `"${safeUser}"\n`;


          recordsToDelete.push(
            docSnap.id
          );


          count++;

        }

      );


      if (
        count === 0
      ) {

        alert(
          "There is no data to export."
        );

        return;

      }


      /*
         ONE FILE ONLY.
      */

      const blob =
        new Blob(
          [csv],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =
        "FirstAirBuilder_Export.csv";


      link.style.display =
        "none";


      document.body.appendChild(
        link
      );


      link.click();


      document.body.removeChild(
        link
      );


      /*
         Release memory.
      */

      setTimeout(
        () => {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );


      /*
         Delete exported records.

         Do it AFTER creating the file.
      */

      const deletePromises =
        recordsToDelete.map(
          id =>
            deleteDoc(
              doc(
                db,
                "scans",
                id
              )
            )
        );


      await Promise.all(
        deletePromises
      );


      alert(
        count +
        " AWB(s) exported successfully in ONE file.\n\n" +
        "Exported data has been cleared."
      );


    } catch (error) {

      console.error(
        "Export error:",
        error
      );


      alert(
        "Export failed.\n\n" +
        error.message
      );

    }

  };


/* =========================================================
   VIBRATION
   ========================================================= */

function vibrate() {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [100, 50, 100]
    );

  }

}


/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    closeCamera();

  }
);


</script>
