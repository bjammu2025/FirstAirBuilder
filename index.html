<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>First Air Builder</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input, button {
      font-size: 2rem;
      padding: 1.3rem;
      margin: 1rem 0;
      width: 95%;
      max-width: 1000px;
      border: none;
      border-radius: 18px;
      box-sizing: border-box;
    }

    input {
      background: white;
      color: black;
    }

    button {
      background-color: #1e88e5;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #1565c0;
    }

    button:disabled {
      background-color: #555;
      color: #aaa;
    }

    .backButton {
      background-color: #555;
    }

    .stopButton {
      background-color: #d32f2f;
    }

    h2 {
      margin: 20px 0;
      font-size: 3.5rem;
    }

    h3 {
      margin: 15px 0;
      font-size: 2.5rem;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 1.6rem;
    }

    th, td {
      border: 2px solid #999;
      padding: 15px;
      text-align: center;
    }

    .screen {
      display: none;
      width: 100%;
    }

    .visible {
      display: block;
    }

    /* ============================
       CAMERA
       ============================ */

    .cameraContainer {
      width: 100%;
      max-width: 900px;
      margin: 10px auto;
      position: relative;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
    }

    #cameraPreview {
      width: 100%;
      display: block;
      background: black;
      object-fit: cover;
    }

    .scanBox {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 35%;
      height: 30%;
      border: 4px solid #00ff00;
      border-radius: 15px;
      box-sizing: border-box;
      pointer-events: none;
    }

    .cameraStatus {
      font-size: 1.7rem;
      margin: 15px 0;
      min-height: 2.5rem;
    }

    .success {
      color: #00e676;
    }

    .error {
      color: #ff5252;
    }

    .scanning {
      color: #ffeb3b;
    }

    .cameraControls {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .smallText {
      font-size: 1.2rem;
      color: #bbb;
      margin: 10px;
    }

    @media (max-width: 600px) {

      h2 {
        font-size: 2.7rem;
      }

      h3 {
        font-size: 1.8rem;
      }

      input, button {
        font-size: 1.5rem;
        padding: 1.1rem;
      }

      table {
        font-size: 1rem;
      }

      th, td {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ============================
       HOME
       ============================ -->

  <div id="home" class="screen visible">

    <h2>First Air Builder</h2>

    <input
      type="text"
      id="userName"
      placeholder="Enter User Name"
      autocomplete="off"
    >

    <button onclick="goToAllocate()">
      ALLOCATE
    </button>

    <button onclick="goToOffload()">
      OFFLOAD
    </button>

    <button onclick="goToLiveView()">
      LIVE VIEW
    </button>

    <button onclick="exportToCSV()">
      EXPORT
    </button>

  </div>


  <!-- ============================
       ALLOCATE START
       ============================ -->

  <div id="allocateStart" class="screen">

    <h3>Allocate Airway Bills</h3>

    <input
      type="text"
      id="allocatePositionId"
      placeholder="Enter Position ID"
      autocomplete="off"
    >

    <button onclick="startAllocate()">
      START CAMERA SCANNING
    </button>

    <button
      class="backButton"
      onclick="goHome()">
      ⬅ BACK
    </button>

  </div>


  <!-- ============================
       ALLOCATE CAMERA
       ============================ -->

  <div id="allocateScan" class="screen">

    <h3>
      Position:
      <span id="allocPosition"></span>
      <br>
      User:
      <span id="allocUser"></span>
    </h3>

    <div class="cameraContainer">

      <video
        id="cameraPreview"
        autoplay
        playsinline
        muted>
      </video>

      <div class="scanBox"></div>

    </div>

    <div
      id="cameraStatus"
      class="cameraStatus scanning">
      Starting camera...
    </div>

    <div class="cameraControls">

      <button
        id="scanNowButton"
        onclick="scanNow()">
        📷 SCAN AWB
      </button>

      <button
        class="stopButton"
        onclick="stopCamera()">
        STOP CAMERA
      </button>

    </div>


    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Airway Bill</th>
          <th>Scanned At</th>
          <th>Scanned By</th>
        </tr>
      </thead>

      <tbody id="scanTable"></tbody>

    </table>

    <button
      class="backButton"
      onclick="goHome()">
      ⬅ BACK
    </button>

  </div>


  <!-- ============================
       OFFLOAD START
       ============================ -->

  <div id="offloadStart" class="screen">

    <h3>Offload Airway Bills</h3>

    <input
      type="text"
      id="offloadPositionId"
      placeholder="Enter Position ID"
      autocomplete="off"
    >

    <button onclick="startOffload()">
      START CAMERA SCANNING
    </button>

    <button
      class="backButton"
      onclick="goHome()">
      ⬅ BACK
    </button>

  </div>


  <!-- ============================
       OFFLOAD CAMERA
       ============================ -->

  <div id="offloadScan" class="screen">

    <h3>
      Offloading:
      <span id="offloadPosition"></span>
      <br>
      User:
      <span id="offloadUser"></span>
    </h3>

    <div class="cameraContainer">

      <video
        id="offloadCameraPreview"
        autoplay
        playsinline
        muted>
      </video>

      <div class="scanBox"></div>

    </div>

    <div
      id="offloadMessage"
      class="cameraStatus scanning">
      Starting camera...
    </div>

    <div class="cameraControls">

      <button
        id="offloadScanButton"
        onclick="scanOffloadNow()">
        📷 SCAN AWB
      </button>

      <button
        class="stopButton"
        onclick="stopCamera()">
        STOP CAMERA
      </button>

    </div>


    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Airway Bill</th>
          <th>Scanned At</th>
          <th>Scanned By</th>
        </tr>
      </thead>

      <tbody id="offloadTable"></tbody>

    </table>

    <button
      class="backButton"
      onclick="goHome()">
      ⬅ BACK
    </button>

  </div>


  <!-- ============================
       LIVE VIEW
       ============================ -->

  <div id="liveView" class="screen">

    <h3>Live Scans Overview</h3>

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Airway Bill</th>
          <th>Position ID</th>
          <th>Scanned At</th>
          <th>Scanned By</th>
        </tr>
      </thead>

      <tbody id="liveTable"></tbody>

    </table>

    <button
      class="backButton"
      onclick="goHome()">
      ⬅ BACK
    </button>

  </div>

</div>


<!--
============================================================
TESSERACT OCR
============================================================
-->

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp,
    query,
    where,
    getDocs,
    deleteDoc
  } from
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


  // ============================================================
  // FIREBASE
  // ============================================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyB3s2DD2auW9bppmAe2ReqZxiz-jCYvd7U",

    authDomain:
      "firstairbuilder.firebaseapp.com",

    projectId:
      "firstairbuilder",

    storageBucket:
      "firstairbuilder.appspot.com",

    messagingSenderId:
      "879078166665",

    appId:
      "1:879078166665:web:40f63a1b2fdfb7833d3658"
  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  // ============================================================
  // GLOBAL VARIABLES
  // ============================================================

  let positionId = "";

  let currentUser = "";

  let liveUnsubscribe = null;

  let cameraStream = null;

  let currentCameraMode = null;

  let ocrWorker = null;

  let ocrBusy = false;


  // ============================================================
  // CAMERA ELEMENTS
  // ============================================================

  const allocateVideo =
    document.getElementById("cameraPreview");

  const offloadVideo =
    document.getElementById("offloadCameraPreview");


  // ============================================================
  // SCREEN CONTROL
  // ============================================================

  function switchScreen(id) {

    document
      .querySelectorAll(".screen")
      .forEach(el =>
        el.classList.remove("visible")
      );

    document
      .getElementById(id)
      .classList.add("visible");
  }


  // ============================================================
  // HOME
  // ============================================================

  window.goHome = async () => {

    await stopCamera();

    switchScreen("home");

    document
      .getElementById("allocatePositionId")
      .value = "";

    document
      .getElementById("offloadPositionId")
      .value = "";

    document
      .getElementById("offloadMessage")
      .innerText = "";

    document
      .getElementById("scanTable")
      .innerHTML = "";

    document
      .getElementById("offloadTable")
      .innerHTML = "";

    positionId = "";

    currentUser = "";

    currentCameraMode = null;
  };


  // ============================================================
  // ALLOCATE
  // ============================================================

  window.goToAllocate = () => {

    currentUser =
      document
        .getElementById("userName")
        .value
        .trim();

    if (!currentUser) {

      alert("Please enter user name");

      return;
    }

    switchScreen("allocateStart");
  };


  // ============================================================
  // OFFLOAD
  // ============================================================

  window.goToOffload = () => {

    currentUser =
      document
        .getElementById("userName")
        .value
        .trim();

    if (!currentUser) {

      alert("Please enter user name");

      return;
    }

    switchScreen("offloadStart");
  };


  // ============================================================
  // EXTRACT 518 NUMBER
  // ============================================================

  function extract518Number(rawText) {

    if (!rawText) return null;


    let text =
      String(rawText)
        .toUpperCase();


    text =
      text
        .replace(/\r/g, " ")
        .replace(/\n/g, " ")
        .replace(/\s+/g, " ")
        .trim();


    /*
      Expected:

      518-YWG-13634095

      OCR may produce:

      518 YWG 13634095
      518-YWG 13634095
      518 - YWG - 13634095
    */


    let match =
      text.match(
        /\b518-[A-Z]{3}-\d{8}\b/
      );


    if (match) {

      return match[0];
    }


    match =
      text.match(
        /\b518\s*[-]?\s*[A-Z]{3}\s*[-]?\s*\d{8}\b/
      );


    if (match) {

      return match[0]
        .replace(/\s+/g, "-")
        .replace(/--+/g, "-");
    }


    match =
      text.match(
        /\b518\s*-\s*[A-Z]{3}\s*-\s*\d{8}\b/
      );


    if (match) {

      return match[0]
        .replace(/\s+/g, "");
    }


    /*
      OCR sometimes reads:

      518-YWG-13634095

      as:

      518-YWG-1363409S

      Try correcting common OCR mistakes
      in the final 8-character number.
    */


    const looseMatch =
      text.match(
        /\b518\s*[- ]\s*[A-Z]{3}\s*[- ]\s*[0-9A-Z]{8}\b/
      );


    if (looseMatch) {

      let result =
        looseMatch[0]
          .replace(/\s+/g, "-")
          .replace(/--+/g, "-");


      /*
        Common OCR substitutions.
      */

      result =
        result
          .replace(/O/g, "0")
          .replace(/I/g, "1")
          .replace(/L/g, "1")
          .replace(/S(?=\d)/g, "5");


      if (
        /^518-[A-Z]{3}-\d{8}$/.test(result)
      ) {

        return result;
      }
    }


    return null;
  }


  // ============================================================
  // INITIALIZE OCR
  // ============================================================

  async function initializeOCR() {

    if (ocrWorker) {

      return;
    }


    setCameraStatus(
      "Loading OCR engine...",
      "scanning"
    );


    try {

      ocrWorker =
        await Tesseract.createWorker(
          "eng",
          1,
          {
            logger: function(info) {

              if (info.status) {

                console.log(
                  "OCR:",
                  info.status,
                  info.progress
                );
              }
            }
          }
        );


      /*
        OCR settings.

        We are mainly interested in:

        518-YWG-13634095
      */

      await ocrWorker.setParameters({

        tessedit_char_whitelist:
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- ",

        preserve_interword_spaces:
          "1"

      });


      setCameraStatus(
        "Camera ready. Position the 518 number inside the green box.",
        "scanning"
      );


    } catch (error) {

      console.error(
        "OCR initialization failed:",
        error
      );


      setCameraStatus(
        "OCR failed to load.",
        "error"
      );
    }
  }


  // ============================================================
  // CAMERA START
  // ============================================================

  async function startCamera(mode) {

    currentCameraMode = mode;


    await stopCamera();


    const video =
      mode === "allocate"
        ? allocateVideo
        : offloadVideo;


    try {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Camera API is not available."
        );
      }


      setCameraStatus(
        "Requesting camera permission...",
        "scanning"
      );


      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            },

            frameRate: {
              ideal: 30
            }

          },

          audio: false

        });


      video.srcObject =
        cameraStream;


      await video.play();


      setCameraStatus(
        "Camera ready. Put 518-YWG-13634095 inside the green box.",
        "scanning"
      );


      initializeOCR();


    } catch (error) {

      console.error(
        "Camera error:",
        error
      );


      setCameraStatus(
        "❌ Camera could not start: " +
        error.message,
        "error"
      );


      alert(
        "Camera could not start.\n\n" +
        "Please make sure Chrome has camera permission " +
        "for this website."
      );
    }
  }


  // ============================================================
  // STOP CAMERA
  // ============================================================

  window.stopCamera = async () => {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      cameraStream = null;
    }


    allocateVideo.srcObject = null;

    offloadVideo.srcObject = null;

    currentCameraMode = null;

    ocrBusy = false;
  };


  // ============================================================
  // CAMERA STATUS
  // ============================================================

  function setCameraStatus(
    message,
    type = "scanning"
  ) {

    const allocateStatus =
      document.getElementById(
        "cameraStatus"
      );

    const offloadStatus =
      document.getElementById(
        "offloadMessage"
      );


    if (
      currentCameraMode === "allocate"
    ) {

      allocateStatus.innerText =
        message;

      allocateStatus.className =
        "cameraStatus " + type;

    } else if (
      currentCameraMode === "offload"
    ) {

      offloadStatus.innerText =
        message;

      offloadStatus.className =
        "cameraStatus " + type;
    }
  }


  // ============================================================
  // TAKE CAMERA PHOTO
  // ============================================================

  async function captureCameraFrame() {

    const video =
      currentCameraMode === "allocate"
        ? allocateVideo
        : offloadVideo;


    if (
      !video ||
      video.readyState <
      HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

      return null;
    }


    const canvas =
      document.createElement("canvas");


    /*
      Use the center portion of the camera.

      This corresponds approximately to
      the green scanning box.
    */


    const videoWidth =
      video.videoWidth;

    const videoHeight =
      video.videoHeight;


    const cropWidth =
      Math.floor(videoWidth * 0.80);

    const cropHeight =
      Math.floor(videoHeight * 0.40);


    const cropX =
      Math.floor(
        (videoWidth - cropWidth) / 2
      );

    const cropY =
      Math.floor(
        (videoHeight - cropHeight) / 2
      );


    canvas.width =
      cropWidth;

    canvas.height =
      cropHeight;


    const ctx =
      canvas.getContext("2d");


    /*
      Increase contrast slightly.
    */

    ctx.filter =
      "contrast(1.25)";


    ctx.drawImage(
      video,
      cropX,
      cropY,
      cropWidth,
      cropHeight,
      0,
      0,
      cropWidth,
      cropHeight
    );


    return canvas;
  }


  // ============================================================
  // OCR SCAN
  // ============================================================

  async function performOCR() {

    if (ocrBusy) {

      return;
    }


    if (!ocrWorker) {

      await initializeOCR();

      if (!ocrWorker) {

        return;
      }
    }


    ocrBusy = true;


    try {

      setCameraStatus(
        "🔍 Reading AWB...",
        "scanning"
      );


      const canvas =
        await captureCameraFrame();


      if (!canvas) {

        return;
      }


      const result =
        await ocrWorker.recognize(
          canvas
        );


      const rawText =
        result.data.text;


      console.log(
        "OCR TEXT:",
        rawText
      );


      const awb =
        extract518Number(rawText);


      if (awb) {

        setCameraStatus(
          "✅ Found: " + awb,
          "success"
        );


        if (
          currentCameraMode ===
          "allocate"
        ) {

          await handleScan(awb);

        } else if (
          currentCameraMode ===
          "offload"
        ) {

          await handleOffload(awb);
        }


        /*
          Give the user time to see
          the successful scan.
        */

        await new Promise(
          resolve =>
            setTimeout(resolve, 1000)
        );


        setCameraStatus(
          "Ready for next AWB.",
          "scanning"
        );


      } else {

        setCameraStatus(
          "No 518 AWB found. Adjust the camera and try again.",
          "error"
        );
      }


    } catch (error) {

      console.error(
        "OCR error:",
        error
      );


      setCameraStatus(
        "OCR error. Try again.",
        "error"
      );


    } finally {

      ocrBusy = false;
    }
  }


  // ============================================================
  // SCAN BUTTON
  // ============================================================

  window.scanNow = async () => {

    if (
      currentCameraMode !==
      "allocate"
    ) {

      return;
    }


    await performOCR();
  };


  window.scanOffloadNow = async () => {

    if (
      currentCameraMode !==
      "offload"
    ) {

      return;
    }


    await performOCR();
  };


  // ============================================================
  // START ALLOCATE
  // ============================================================

  window.startAllocate = async () => {

    positionId =
      document
        .getElementById(
          "allocatePositionId"
        )
        .value
        .trim();


    if (!positionId) {

      alert(
        "Enter Position ID"
      );

      return;
    }


    document
      .getElementById(
        "allocPosition"
      )
      .innerText =
      positionId;


    document
      .getElementById(
        "allocUser"
      )
      .innerText =
      currentUser;


    switchScreen(
      "allocateScan"
    );


    await loadAllocateAWBs(
      positionId
    );


    await startCamera(
      "allocate"
    );
  };


  // ============================================================
  // LOAD ALLOCATE AWBs
  // ============================================================

  async function loadAllocateAWBs(
    posId
  ) {

    const table =
      document.getElementById(
        "scanTable"
      );


    table.innerHTML =
      "<tr><td colspan='4'>Loading...</td></tr>";


    const scansCol =
      collection(
        db,
        "scans"
      );


    const q =
      query(
        scansCol,
        where(
          "positionId",
          "==",
          posId
        )
      );


    const snapshot =
      await getDocs(q);


    if (snapshot.empty) {

      table.innerHTML =
        `<tr>
          <td colspan="4">
            No AWBs allocated to Position ID: ${posId}
          </td>
        </tr>`;

      return;
    }


    let rowsHTML = "";

    let idx = 1;


    snapshot.forEach(
      docSnap => {

        const d =
          docSnap.data();


        const scannedAtStr =
          d.scannedAt
            ? new Date(
                d.scannedAt.seconds *
                1000
              ).toLocaleString()
            : "N/A";


        rowsHTML +=
          `<tr>
            <td>${idx++}</td>
            <td>${d.code}</td>
            <td>${scannedAtStr}</td>
            <td>${d.scannedBy}</td>
          </tr>`;
      }
    );


    table.innerHTML =
      rowsHTML;
  }


  // ============================================================
  // HANDLE ALLOCATE
  // ============================================================

  async function handleScan(code) {

    if (!code) return;


    console.log(
      "Processing AWB:",
      code
    );


    const scansCol =
      collection(
        db,
        "scans"
      );


    const q =
      query(
        scansCol,
        where(
          "code",
          "==",
          code
        )
      );


    const snapshot =
      await getDocs(q);


    if (!snapshot.empty) {

      let duplicateDoc =
        null;


      snapshot.forEach(
        docSnap => {

          const d =
            docSnap.data();


          if (
            d.positionId !==
            "[REMOVED]"
          ) {

            duplicateDoc = d;
          }
        }
      );


      if (duplicateDoc) {

        setCameraStatus(
          `❌ Duplicate AWB: ${code}\n` +
          `Already allocated to Position ID: ${duplicateDoc.positionId}`,
          "error"
        );


        vibrate();


        return;
      }
    }


    try {

      await addDoc(
        collection(
          db,
          "scans"
        ),
        {

          code:

            code,

          positionId:

            positionId,

          scannedAt:

            serverTimestamp(),

          scannedBy:

            currentUser

        }
      );


      await loadAllocateAWBs(
        positionId
      );


      vibrate();


    } catch (error) {

      console.error(
        error
      );


      setCameraStatus(
        "❌ Failed to save scan.",
        "error"
      );
    }
  }


  // ============================================================
  // START OFFLOAD
  // ============================================================

  window.startOffload =
    async () => {

      const pos =
        document
          .getElementById(
            "offloadPositionId"
          )
          .value
          .trim();


      if (!pos) {

        alert(
          "Enter Position ID"
        );

        return;
      }


      positionId =
        pos;


      document
        .getElementById(
          "offloadPosition"
        )
        .innerText =
        positionId;


      document
        .getElementById(
          "offloadUser"
        )
        .innerText =
        currentUser;


      document
        .getElementById(
          "offloadMessage"
        )
        .innerText =
        "Starting camera...";


      switchScreen(
        "offloadScan"
      );


      await loadOffloadAWBs(
        positionId
      );


      await startCamera(
        "offload"
      );
    };


  // ============================================================
  // LOAD OFFLOAD AWBs
  // ============================================================

  async function loadOffloadAWBs(
    posId
  ) {

    const table =
      document.getElementById(
        "offloadTable"
      );


    table.innerHTML =
      "<tr><td colspan='4'>Loading...</td></tr>";


    const scansCol =
      collection(
        db,
        "scans"
      );


    const q =
      query(
        scansCol,
        where(
          "positionId",
          "==",
          posId
        )
      );


    const snapshot =
      await getDocs(q);


    if (snapshot.empty) {

      table.innerHTML =
        `<tr>
          <td colspan="4">
            No AWBs found for Position ID: ${posId}
          </td>
        </tr>`;

      return;
    }


    let rowsHTML = "";

    let idx = 1;


    snapshot.forEach(
      docSnap => {

        const d =
          docSnap.data();


        const scannedAtStr =
          d.scannedAt
            ? new Date(
                d.scannedAt.seconds *
                1000
              ).toLocaleString()
            : "N/A";


        rowsHTML +=
          `<tr>
            <td>${idx++}</td>
            <td>${d.code}</td>
            <td>${scannedAtStr}</td>
            <td>${d.scannedBy}</td>
          </tr>`;
      }
    );


    table.innerHTML =
      rowsHTML;
  }


  // ============================================================
  // HANDLE OFFLOAD
  // ============================================================

  async function handleOffload(
    code
  ) {

    if (!code) return;


    console.log(
      "Offloading:",
      code
    );


    const scansCol =
      collection(
        db,
        "scans"
      );


    const q =
      query(
        scansCol,
        where(
          "code",
          "==",
          code
        )
      );


    const snapshot =
      await getDocs(q);


    if (snapshot.empty) {

      setCameraStatus(
        `❌ AWB ${code} not found.`,
        "error"
      );

      return;
    }


    let foundForPosition =
      false;


    for (
      const docSnap
      of snapshot.docs
    ) {

      const d =
        docSnap.data();


      if (
        d.positionId ===
        positionId
      ) {

        await updateDoc(
          doc(
            db,
            "scans",
            docSnap.id
          ),
          {
            positionId:
              "[REMOVED]"
          }
        );


        setCameraStatus(
          `✅ Removed: ${code}`,
          "success"
        );


        foundForPosition =
          true;


        vibrate();


        break;
      }
    }


    if (!foundForPosition) {

      setCameraStatus(
        `❌ AWB ${code} is not allocated to Position ID: ${positionId}`,
        "error"
      );
    }


    await loadOffloadAWBs(
      positionId
    );
  }


  // ============================================================
  // EXPORT CSV
  // ============================================================

  window.exportToCSV = () => {

    onSnapshot(
      collection(
        db,
        "scans"
      ),

      async snapshot => {

        let csv =
          "data:text/csv;charset=utf-8,\uFEFF" +
          "Airway Bill,Position ID,Scanned At,Scanned By\n";


        const deletePromises =
          [];


        snapshot.forEach(
          docSnap => {

            const d =
              docSnap.data();


            if (
              d.positionId !==
                "[REMOVED]" &&
              d.scannedAt
            ) {

              csv +=
                `"${d.code}",` +
                `"${d.positionId}",` +
                `"${new Date(
                  d.scannedAt.seconds *
                  1000
                ).toLocaleString()}",` +
                `"${d.scannedBy}"\n`;


              deletePromises.push(
                deleteDoc(
                  doc(
                    db,
                    "scans",
                    docSnap.id
                  )
                )
              );
            }
          }
        );


        const link =
          document.createElement(
            "a"
          );


        link.href =
          encodeURI(csv);


        link.download =
          "FirstAirBuilder_Export.csv";


        document.body.appendChild(
          link
        );


        link.click();


        document.body.removeChild(
          link
        );


        await Promise.all(
          deletePromises
        );


        alert(
          "Export complete and all exported data cleared."
        );
      },

      {
        once: true
      }
    );
  };


  // ============================================================
  // LIVE VIEW
  // ============================================================

  window.goToLiveView =
    () => {

      switchScreen(
        "liveView"
      );


      const table =
        document.getElementById(
          "liveTable"
        );


      if (
        typeof liveUnsubscribe ===
        "function"
      ) {

        liveUnsubscribe();
      }


      liveUnsubscribe =
        onSnapshot(
          collection(
            db,
            "scans"
          ),

          snapshot => {

            const rows =
              [];


            snapshot.forEach(
              docSnap => {

                const data =
                  docSnap.data();


                if (
                  data.positionId !==
                    "[REMOVED]" &&
                  data.scannedAt
                ) {

                  rows.push({

                    ...data,

                    scannedAt:
                      new Date(
                        data.scannedAt.seconds *
                        1000
                      ).toLocaleString()

                  });
                }
              }
            );


            rows.sort(
              (a, b) =>
                new Date(
                  b.scannedAt
                ) -
                new Date(
                  a.scannedAt
                )
            );


            table.innerHTML =
              rows
                .map(
                  (entry, idx) =>
                    `<tr>
                      <td>${idx + 1}</td>
                      <td>${entry.code}</td>
                      <td>${entry.positionId}</td>
                      <td>${entry.scannedAt}</td>
                      <td>${entry.scannedBy}</td>
                    </tr>`
                )
                .join("");
          }
        );
    };


  // ============================================================
  // VIBRATION
  // ============================================================

  function vibrate() {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        100
      );
    }
  }


  // ============================================================
  // PAGE CLEANUP
  // ============================================================

  window.addEventListener(
    "pagehide",
    () => {

      stopCamera();

    }
  );

</script>

</body>
</html>
